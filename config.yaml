version: 2

llm:
  provider: openai_compatible            # openai, openai_compatible, deepseek, azure, anthropic, google
  model: deepseek-v4-flash
  temperature: 0.2
  max_tokens: 8192
  # For openai / openai_compatible (DeepSeek, local, etc.)
  base_url: ""                          # e.g., https://api.deepseek.com/v1
  api_key: ${OPENAI_API_KEY}            # use env var
  # For Azure
  azure_endpoint: ""
  api_version: ""

search:
  provider: duckduckgo                    # or bing, serper
  bing_api_key: ${BING_API_KEY}

scraping:
  headless: true
  browser_timeout: 30
  max_concurrent_jobs: 3
  max_retries_per_step: 3
  request_delay_sec: 1.0
  skip_children_if_records_ge: 0  # skip child pages if parent has this many records (0=disabled)

files:
  input_excel: "universities.xlsx"
  output_excel: "faculty_data.xlsx"
  schema_file: "schema.json"
  cache_dir: "./cache"
  cache_enabled: true            # Set to false to disable caching entirely

department:
  discovery_enabled: true                # allow university-only entries
