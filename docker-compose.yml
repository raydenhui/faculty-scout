# ---- docker-compose for faculty-scout ----
#
# Runs the REST API server by default on port 8000.
# For the MCP server (SSE), set FSC_MODE=mcp or override the command.
#
# Startup:
#   docker compose up -d --build faculty-scout
#
# n8n integration (same Docker network):
#   REST:  POST http://faculty-scout:8000/api/run
#   MCP:   http://faculty-scout:8000/sse  (when FSC_MODE=mcp)
#

services:
  faculty-scout:
    build: .
    container_name: faculty-scout
    restart: unless-stopped
    environment:
      FSC_MODE: ${FSC_MODE:-api}          # "api" or "mcp"
    ports:
      - "8000:8000"
    volumes:
      # Mount your input/output Excel files and config
      - ./universities.xlsx:/app/universities.xlsx
      - ./faculty_data.xlsx:/app/faculty_data.xlsx
      - ./config.yaml:/app/config.yaml
      - ./schema.json:/app/schema.json
      # Persist the cache across restarts
      - scout_cache:/app/cache

volumes:
  scout_cache:
